name: Inspect legacy map HTML
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect
        run: |
          mkdir -p /tmp/a
          sed -n "/base64 -d <<'MRTAPP_EOF'/,/MRTAPP_EOF/p" .github/workflows/build-android-dev.yml | sed '1d;$d' | sed 's/^          //' | base64 -d | gunzip > /tmp/a/index.html
          python3 - <<'PY'
          import re
          h=open('/tmp/a/index.html',encoding='utf-8').read()
          print("HTML_BYTES",len(h))
          terms = ['trainDot','trainMarker','trainMark','trainEl','drawTrain','renderTrain','mapTrain','trainIcon','trainPos','trainLayer','trainSvg','marker','trainMarkers','trainMarker']
          for term in terms:
            print("\\n=== TERM",term,"===")
            pos=0; count=0
            while count < 20:
              m=h.lower().find(term.lower(),pos)
              if m < 0: break
              a=max(0,m-700); b=min(len(h),m+1800)
              print(h[a:b].replace("\\n"," ")[:2500])
              pos=m+len(term); count+=1
          PY

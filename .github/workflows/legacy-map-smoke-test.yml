name: Legacy map smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-map-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the app page
        run: |
          python3 - <<'PY'
          import pathlib
          html = pathlib.Path("android/app/src/main/assets/index.html").read_text(encoding="utf-8")
          print(f"index.html: {len(html):,} bytes")
          if len(html) < 100_000:
              raise SystemExit("The app page is unexpectedly small; possible accidental rebuild/truncation.")

          required = {
              "Map tab": "Map",
              "Line Board tab": "Line Board",
              "Plan a trip": "Plan a trip",
              "3D control": "3D",
              "station search": "Search station or code",
              "train markers": "trains running",
          }
          missing = [name for name, needle in required.items() if needle not in html]
          if missing:
              raise SystemExit("Legacy map features missing: " + ", ".join(missing))

          # This legacy app uses its own embedded map renderer rather than
          # necessarily exposing Leaflet/MapLibre as a literal dependency.
          # The feature checks above are the compatibility contract.
          print("Legacy map smoke test passed.")
          PY

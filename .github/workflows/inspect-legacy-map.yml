name: Inspect legacy map HTML
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect
        run: |
          mkdir -p /tmp/a
          sed -n "/base64 -d <<'MRTAPP_EOF'/,/MRTAPP_EOF/p" .github/workflows/build-android-dev.yml | sed '1d;$d' | sed 's/^          //' | base64 -d | gunzip > /tmp/a/index.html
          python3 - <<'PY'
          import re
          h=open('/tmp/a/index.html',encoding='utf-8').read()
          print("HTML_BYTES",len(h))
          pats = [
            r'function\\s+\\w*(?:train|map|draw|render|marker)\\w*\\s*\\(',
            r'\\b(?:train|trains)\\b.{0,120}\\b(?:marker|dot|svg|canvas|map)\\b',
            r'\\b(?:marker|dot|svg|canvas|map)\\b.{0,120}\\b(?:train|trains)\\b',
            r'new\\s+Map\\(',
            r'querySelectorAll\\([^)]*train',
          ]
          for p in pats:
            print("\\n=== PATTERN",p,"===")
            try:
              ms=list(re.finditer(p,h,re.I))
            except Exception as e:
              print("PATTERN ERROR",e); continue
            for m in ms[:30]:
              a=max(0,m.start()-700); b=min(len(h),m.end()+1800)
              print(h[a:b].replace('\\n',' ')[:2500])
          PY

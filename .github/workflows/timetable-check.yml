# Checks the trains-in-service and headway figures in the dev app page (android/app/src/main/assets/index.html).
# It does not build an apk and it does not publish anything.
name: Timetable checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check trains in service and headways
        env:
          MRT_INDEX: android/app/src/main/assets/index.html
        run: node --test tests/timetable.test.mjs tests/day-simulation.test.mjs

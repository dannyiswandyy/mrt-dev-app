name: Build MRT Dev app
on:
  push:
    paths:
      - .github/workflows/build-android-dev.yml
  workflow_dispatch:
permissions:
  contents: write
env:
  CHANNEL: dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the app project
        run: |
          rm -rf mrt-tracker-app
          mkdir -p 'mrt-tracker-app'
          mkdir -p 'mrt-tracker-app/app'
          cat > 'mrt-tracker-app/app/build.gradle' <<'MRTAPP_EOF'
          plugins {
              id 'com.android.application'
          }
          // Which app to build: "beta" is MRT Tracker; "dev" is MRT Tracker, a separate app (its own name, icon
          // and settings) for trying new features before they go into MRT Tracker. Set by the workflow file.
          def channel = (project.findProperty('channel') ?: 'beta').toString() == 'dev' ? 'dev' : 'beta'
          // Scrambles a key with a mask made from the app's package name; the app unscrambles it in memory.
          def scrambleKey = { String s ->
              s = (s ?: '').trim()
              if (s.isEmpty()) return ''
              byte[] mask = java.security.MessageDigest.getInstance('SHA-256').digest('sg.mrttracker.app'.getBytes('UTF-8'))
              byte[] b = s.getBytes('UTF-8')
              StringBuilder sb = new StringBuilder()
              for (int i = 0; i < b.length; i++) sb.append(String.format('%02x', (b[i] ^ mask[i % mask.length]) & 0xff))
              return sb.toString()
          }
          android {
              namespace 'sg.mrttracker.app'
              compileSdk 34
              defaultConfig {
                  applicationId channel == 'dev' ? 'sg.mrttracker.app.dev' : 'sg.mrttracker.app'
                  resValue 'string', 'app_name', channel == 'dev' ? 'MRT Dev' : 'MRT Tracker'
                  resValue 'color', 'icon_bg', channel == 'dev' ? '#C2410C' : '#14181D'
                  buildConfigField 'String', 'CHANNEL', '"' + channel + '"'
                  minSdk 24
                  targetSdk 34
                  // GitHub passes in a number that grows with every build (minutes since 2026), so each
                  // new build installs over the last one, and the build date and time as the version name.
                  versionCode Integer.parseInt((project.findProperty('vc') ?: '1').toString())
                  versionName((project.findProperty('vn') ?: 'dev').toString())
                  // LTA DataMall key built into the app, so live alerts work for everyone with no setup.
                  // Stored scrambled (the app unscrambles it in memory), so it can't be read from this file
                  // or found by searching the app's contents.
                  // Public GitHub repo the app checks for updates, e.g. yourname/mrt-tracker-releases (empty = off).
                  buildConfigField 'String', 'UPDATE_REPO', '"' + (project.findProperty('updateRepo') ?: '').toString().replaceAll('[^A-Za-z0-9._/-]', '') + '"'
                  buildConfigField 'String', 'LTA_KEY_X', '"ac482e340c45fb8ce3d416f40eeba0afa7c59acac8579667"'
                  // Claude API key for the Ask tab, from the ANTHROPIC_API_KEY GitHub secret (none = built-in answers only).
                  buildConfigField 'String', 'AI_KEY_X', '"' + scrambleKey((project.findProperty('aiKey') ?: '').toString()) + '"'
              }
              buildFeatures {
                  buildConfig true
                  resValues true
              }
              dependencies {
                  implementation "androidx.webkit:webkit:1.18.0"
              }
              signingConfigs {
                  release {
                      // The keystore is created once by the GitHub build and kept in the repo,
                      // so every later build is signed with the same key.
                      storeFile file(project.findProperty('ks') ?: 'missing.jks')
                      storePassword 'mrttracker'
                      keyAlias 'mrttracker'
                      keyPassword 'mrttracker'
                  }
              }
              buildTypes {
                  release {
                      // Shrink and scramble the app's code so it's harder to pick apart.
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app'
          cat > 'mrt-tracker-app/app/proguard-rules.pro' <<'MRTAPP_EOF'
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keepattributes JavascriptInterface
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main'
          cat > 'mrt-tracker-app/app/src/main/AndroidManifest.xml' <<'MRTAPP_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <!-- In-app updates: install new versions, notify about them, and keep checking after a restart. -->
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <!-- Offline mode: notices when the connection drops, to show saved data. -->
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:usesCleartextTraffic="false"
                  android:networkSecurityConfig="@xml/network_security_config">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".UpdateJob"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />
                  <receiver
                      android:name=".InstallReceiver"
                      android:exported="false" />
                  <!-- Home screen widget: next trains at the first saved station. -->
                  <receiver
                      android:name=".TrainWidget"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/train_widget_info" />
                  </receiver>
                  <!-- Trip reminders, set from the planned timetable. -->
                  <receiver
                      android:name=".TripAlarm"
                      android:exported="false" />
                  <!-- Disruption check for the saved lines while the app is closed. -->
                  <service
                      android:name=".AlertJob"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />
              </application>
          </manifest>
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/assets'
          base64 -d <<'MRTAPP_EOF' | gunzip > 'mrt-tracker-app/app/src/main/assets/index.html'

          MRTAPP_EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('mrt-tracker-app/app/src/main/assets/index.html')
          h = p.read_text(encoding='utf-8')
          print('SPOT_DIAG_HTML_BYTES', len(h))
          for term in ['spotLive','spotSync','spotJudge','spotDraw','spotFrame','spotGap','spotLabels']:
              for m in list(re.finditer(r'function\s+' + re.escape(term) + r'\s*\(', h))[:3]:
                  a=max(0,m.start()-1200); b=min(len(h),m.end()+5000)
                  print(f'--- {term} @ {m.start()} ---')
                  print(h[a:b].replace('\\n',' ')[:6500])
          print('--- SPOT STORAGE/LOG REFERENCES ---')
          for m in list(re.finditer(r'(?:localStorage|sessionStorage)[^;]{0,220}', h, re.I))[:80]:
              s=m.group(0)
              if re.search(r'spot|log|sight|train', s, re.I):
                  print(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('mrt-tracker-app/app/src/main/assets/index.html').read_text(encoding='utf-8')
          print('--- SPOT IDS ---')
          for m in re.finditer(r'id=["\']([^"\']*(?:spot|log|sight|train)[^"\']*)["\']',h,re.I):
              print(h[max(0,m.start()-180):min(len(h),m.end()+260)].replace('\\n',' '))
          print('--- SPOT/TRAIN FUNCTION NAMES ---')
          for m in re.finditer(r'(?:function|window\.)([A-Za-z_$][\\w$]*(?:spot|log|sight|train)[A-Za-z_$]*)',h,re.I):
              print(m.group(1))
          print('--- MANUAL-LOOKING TEXT ---')
          for m in re.finditer(r'.{0,180}(?:log spotting|spotting log|log a train|logged|sighting|seen at|at station|train id).{0,300}',h,re.I|re.S):
              print(m.group(0).replace('\\n',' ')[:700])
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('mrt-tracker-app/app/src/main/assets/index.html').read_text(encoding='utf-8')
          for name in ['repCandidates','repRender','repOpen','repClose','repSubmit','repShift','repRun','repToday']:
              m=re.search(r'function\\s+'+name+r'\\s*\\([^)]*\\)\\s*\\{',h)
              if m:
                  n=re.search(r'\\nfunction\\s+',h[m.end():])
                  end=m.end()+ (n.start() if n else 9000)
                  print('--- FUNC '+name+' ---')
                  print(h[m.start():min(end,m.start()+9000)])
          print('--- REPORT EVENT/RENDER REFS ---')
          for pat in ['repOpenBtn','repEntry','repCount','trainReports','REPS\\.push','repForm','repMsgText']:
              print('PAT',pat)
              for m in list(re.finditer(pat,h))[:12]:
                  print(h[max(0,m.start()-500):min(len(h),m.end()+1200)].replace('\\n',' ')[:1800])
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mrt-tracker-app/app/src/main/assets/index.html')
          h = p.read_text(encoding='utf-8')
          patch = r'''<script>
          (() => {
            const paint = () => {
              try {
                const w = document.getElementById("mapWrap");
                if (!w || w.hidden || !document.getElementById("mapCv")) return;
                if (typeof mapResize === "function") mapResize();
                if (typeof mapDraw === "function") mapDraw();
              } catch (_) {}
            };
            const start = () => {
              paint();
              setTimeout(paint, 120);
              setTimeout(paint, 500);
              setTimeout(paint, 1200);
              setInterval(paint, 1000);
              try {
                if (typeof refreshCrowd === "function") setTimeout(() => refreshCrowd(true), 700);
              } catch (_) {}
            };
            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", start, {once:true});
            } else start();
            document.addEventListener("visibilitychange", () => {
              if (!document.hidden) setTimeout(paint, 80);
            });
          })();
          </script>'''
          if 'data-mrt-map-paint-fix="1"' not in h:
              h = h.replace('</body>', '<div data-mrt-map-paint-fix="1" hidden></div>' + patch + '</body>')
              p.write_text(h, encoding='utf-8')
          PY
          mkdir -p 'mrt-tracker-app/app/src/main/assets'
          cat > 'mrt-tracker-app/app/src/main/assets/livecam.html' <<'MRTAPP_EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="referrer" content="strict-origin-when-cross-origin">
          <title>Live cam</title>
          <style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#player,iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style>
          </head>
          <body>
          <div id="player"></div>
          <script>
          /* The Live cam tab's video player. The app serves this page at https://sg.mrttracker.app/livecam.html
             (it never comes from the internet), so YouTube can tell which app is showing its video. It plays one
             video (?v=) or a channel's live stream (?c=), tells the tracker page what the player is doing, and
             takes "mute", "unmute" and "play" from it. */
          (function(){
            var q = new URLSearchParams(location.search), v = q.get("v") || "", c = q.get("c") || "";
            if (!/^[A-Za-z0-9_-]{11}$/.test(v)) v = "";
            if (!/^UC[A-Za-z0-9_-]{22}$/.test(c)) c = "";
            var muted = q.get("mute") !== "0", player = null;
            function tell(m){ m.mrtcam = 1; try { parent.postMessage(m, "*"); } catch(e){} }
            if (!v && !c){ tell({error: "none"}); return; }
            window.onYouTubeIframeAPIReady = function(){
              var vars = {autoplay: 1, mute: muted ? 1 : 0, playsinline: 1, rel: 0, origin: location.origin, widget_referrer: location.href};
              if (!v) vars.channel = c;
              player = new YT.Player("player", {
                host: v ? "https://www.youtube-nocookie.com" : "https://www.youtube.com",
                videoId: v || "live_stream",
                playerVars: vars,
                events: {
                  onReady: function(e){ if (muted) e.target.mute(); e.target.playVideo(); tell({ready: 1}); },
                  onStateChange: function(e){ tell({state: e.data}); },
                  onError: function(e){ tell({error: e.data}); }
                }
              });
            };
            window.addEventListener("message", function(e){
              if (e.source !== parent || !player || !e.data || !e.data.mrtcam) return;
              try {
                if (e.data.cmd === "mute") player.mute();
                else if (e.data.cmd === "unmute"){ player.unMute(); player.setVolume(100); player.playVideo(); }
                else if (e.data.cmd === "play") player.playVideo();
              } catch(err){}
            });
            var s = document.createElement("script");
            s.src = "https://www.youtube.com/iframe_api";
            s.onerror = function(){ tell({error: "api"}); };
            document.head.appendChild(s);
          })();
          </script>
          </body>
          </html>
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/java/sg/mrttracker/app'
          cat > 'mrt-tracker-app/app/src/main/java/sg/mrttracker/app/InstallReceiver.java' <<'MRTAPP_EOF'
          package sg.mrttracker.app;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInstaller;
          import android.os.Build;
          /** Hears back from Android's installer; shows Android's "Update this app?" screen when it asks. */
          public class InstallReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  int status = intent.getIntExtra(PackageInstaller.EXTRA_STATUS, PackageInstaller.STATUS_FAILURE);
                  if (status == PackageInstaller.STATUS_PENDING_USER_ACTION) {
                      Intent confirm = Build.VERSION.SDK_INT >= 33
                              ? intent.getParcelableExtra(Intent.EXTRA_INTENT, Intent.class)
                              : intent.getParcelableExtra(Intent.EXTRA_INTENT);
                      if (confirm != null) {
                          confirm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          try {
                              context.startActivity(confirm);
                          } catch (Exception ignored) {
                          }
                      }
                  } else if (status != PackageInstaller.STATUS_SUCCESS) {
                      MainActivity.reportUpdateError(intent.getStringExtra(PackageInstaller.EXTRA_STATUS_MESSAGE));
                  }
              }
          }
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/java/sg/mrttracker/app'
          cat > 'mrt-tracker-app/app/src/main/java/sg/mrttracker/app/MainActivity.java' <<'MRTAPP_EOF'
          package sg.mrttracker.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import androidx.webkit.WebViewAssetLoader;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import org.json.JSONObject;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.Arrays;
          import java.util.HashSet;
          import java.util.Set;
          public class MainActivity extends Activity {
              /** The only sites the tracker page may ask the app to fetch. */
              private static final Set<String> ALLOWED_HOSTS = new HashSet<>(Arrays.asList(
                      "datamall2.mytransport.sg",
                      "news.google.com",
                      "api-open.data.gov.sg"));      // NEA live weather (data.gov.sg)
              /** The app's own page, bundled inside the app. */
              private static final String PAGE_URL = "https://sg.mrttracker.app/assets/index.html";
              private WebViewAssetLoader assetLoader;
              /** Where LTA's temporary timetable download links point. */
              private static final String LTA_FILES_HOST = "dmprod-datasets.s3.ap-southeast-1.amazonaws.com";
              /**
               * The Live cam tab's player page (assets/livecam.html) is served at this address, never fetched from
               * the internet. YouTube only plays embedded videos for an app that identifies itself with an https
               * address (its "Referer"), which the tracker page itself, a bundled file, can't give.
               */
              private static final String CAM_HOST = "sg.mrttracker.app";
              private static final String CAM_CSP = "default-src 'none'; script-src 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; "
                      + "frame-src https://www.youtube.com https://www.youtube-nocookie.com; style-src 'unsafe-inline'; img-src https: data:; "
                      + "base-uri 'none'; form-action 'none'";
              /** The Claude API (Anthropic), used by the Ask tab, and the model it uses. */
              private static final String AI_URL = "https://api.anthropic.com/v1/messages";
              private static final String AI_MODEL = "claude-haiku-5-5";
              private WebView web;
              private String cachedKey = null;
              private String cachedAiKey = null;
              private SharedPreferences prefs;
              private boolean pageLoaded = false;
              private boolean updating = false;
              /** A video shown full screen (the Live cam's full-screen button), and how to hand it back. */
              private View fullView = null;
              private WebChromeClient.CustomViewCallback fullDone = null;
              // DEV:START
              /** Train spotting (MRT Tracker's Live cam): the box over the tracks, in the page's CSS pixels, and how often to look. */
              private final android.os.Handler camHandler = new android.os.Handler(android.os.Looper.getMainLooper());
              private android.graphics.RectF camBox = null;
              private int camEvery = 200;
              private boolean camCopying = false;
              private final Runnable camTick = new Runnable() {
                  @Override
                  public void run() {
                      if (camBox == null) return;
                      camCapture();
                      camHandler.postDelayed(this, camEvery);
                  }
              };
              // DEV:END
              private static java.lang.ref.WeakReference<MainActivity> current = new java.lang.ref.WeakReference<>(null);
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("settings", MODE_PRIVATE);
                  prefs.edit().remove("spot_host").apply();   // spotter feed from older versions is no longer used
                  prefs.edit().remove("lta_key").apply();   // keys typed into older versions are no longer used
                  getSharedPreferences("game", MODE_PRIVATE).edit().clear().apply();   // the spotting game was removed
                  // Nobody can attach a debugger to the page inside this app.
                  WebView.setWebContentsDebuggingEnabled(false);
                  web = new WebView(this);
                  assetLoader = new WebViewAssetLoader.Builder()
                          .setDomain(CAM_HOST)
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setAllowFileAccessFromFileURLs(false);
                  s.setAllowUniversalAccessFromFileURLs(false);
                  s.setGeolocationEnabled(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  // The page only needs its own bundled file; it may not read other files on the phone.
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setAllowFileAccessFromFileURLs(false);
                  s.setAllowUniversalAccessFromFileURLs(false);
                  s.setGeolocationEnabled(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  if (Build.VERSION.SDK_INT >= 26) s.setSafeBrowsingEnabled(true);
                  android.webkit.CookieManager.getInstance().setAcceptThirdPartyCookies(web, false);
                  // The Live cam starts playing as soon as its tab opens.
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.addJavascriptInterface(new Bridge(), "MrtApp");
                  // Offline: with no connection, map tiles and fonts come from the WebView's own cache.
                  watchNetwork();
                  // Full screen for the Live cam video (YouTube's full-screen button), sideways while it's shown.
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (fullView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          fullView = view;
                          fullDone = callback;
                          ((FrameLayout) getWindow().getDecorView()).addView(view, new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          systemBars(false);
                          setRequestedOrientation(android.content.pm.ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                      }
                      @Override
                      public void onHideCustomView() {
                          leaveFullScreen();
                      }
                      /** No grey "play" placeholder before the video starts. */
                      @Override
                      public android.graphics.Bitmap getDefaultVideoPoster() {
                          return android.graphics.Bitmap.createBitmap(1, 1, android.graphics.Bitmap.Config.ARGB_8888);
                      }
                  });
                  // Keep the tracker inside the app. Web links (https/http) open in the browser or the
                  // X/Facebook app; every other kind of link (app intents, scripts, other files) is blocked.
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          // Frames inside the page (the Live cam player) may only go where the page's
                          // security rules allow (the player page, then YouTube), so let them load.
                          if (!request.isForMainFrame()) return false;
                          Uri uri = request.getUrl();
                          String u = uri.toString();
                          if ("https".equals(uri.getScheme()) && CAM_HOST.equals(uri.getHost()) && (uri.getPath().startsWith("/assets/") || "/livecam.html".equals(uri.getPath()))) return false;
                          String scheme = uri.getScheme() == null ? "" : uri.getScheme().toLowerCase(java.util.Locale.ROOT);
                          if (scheme.equals("https") || scheme.equals("http")) {
                              try {
                                  Intent i = new Intent(Intent.ACTION_VIEW, uri);
                                  i.addCategory(Intent.CATEGORY_BROWSABLE);
                                  startActivity(i);
                              } catch (Exception ignored) {
                              }
                          }
                          return true;
                      }
                      /** Serves the Live cam player page at https://sg.mrttracker.app/livecam.html (nothing else there). */
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if (!"https".equals(uri.getScheme()) || !CAM_HOST.equals(uri.getHost())) return null;
                          java.util.Map<String, String> h = new java.util.HashMap<>();
                          h.put("Content-Security-Policy", CAM_CSP);
                          h.put("Referrer-Policy", "strict-origin-when-cross-origin");
                          h.put("Cache-Control", "no-store");
                          if ("/livecam.html".equals(uri.getPath())) {
                              try {
                                  return new WebResourceResponse("text/html", "utf-8", 200, "OK", h, getAssets().open("livecam.html"));
                              } catch (Exception ignored) {
                              }
                          }
                          WebResourceResponse local = assetLoader.shouldInterceptRequest(uri);
                          if (local != null) return local;
                          return new WebResourceResponse("text/plain", "utf-8", 404, "Not Found", h,
                                  new java.io.ByteArrayInputStream(new byte[0]));
                      }
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          pageLoaded = true;
                          checkForUpdate();
                      }
                      @Override
                      public boolean onRenderProcessGone(WebView view, android.webkit.RenderProcessGoneDetail detail) {
                          pageLoaded = false;

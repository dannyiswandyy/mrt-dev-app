name: Legacy map smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-map-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract embedded app page
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          raw = pathlib.Path("data/mrt-dev-page.b64").read_text()
          html = gzip.decompress(base64.b64decode(raw)).decode("utf-8")
          pathlib.Path("/tmp/index.html").write_text(html)
          print(f"Extracted index.html: {len(html):,} bytes")
          if len(html) < 100_000:
              raise SystemExit("Extracted app page is unexpectedly small; possible accidental rebuild/truncation.")

          required = {
              "Map tab": "Map",
              "Line Board tab": "Line Board",
              "Plan a trip": "Plan a trip",
              "3D control": "3D",
              "station search": "Search station or code",
              "train markers": "trains running",
          }
          missing = [name for name, needle in required.items() if needle not in html]
          if missing:
              raise SystemExit("Legacy map features missing: " + ", ".join(missing))

          # This legacy app uses its own embedded map renderer rather than
          # necessarily exposing Leaflet/MapLibre as a literal dependency.
          # The feature checks above are the compatibility contract.
          print("Legacy map smoke test passed.")
          PY

      - name: Check workflow compression stays consistent
        run: |
          if grep -q "xz -d" .github/workflows/build-android-dev.yml; then
            echo "ERROR: build workflow uses XZ but the embedded page is gzip."
            exit 1
          fi
          if grep -q "lzma" .github/workflows/build-android-dev.yml; then
            echo "ERROR: build workflow contains stale LZMA extraction logic."
            exit 1
          fi
          grep -q "gunzip" .github/workflows/build-android-dev.yml
          echo "Compression format check passed."

                      byte[] mask = java.security.MessageDigest.getInstance("SHA-256").digest("sg.mrttracker.app".getBytes(StandardCharsets.UTF_8));
                      byte[] out = new byte[hx.length() / 2];
                      for (int i = 0; i < out.length; i++) {

# Checks the trains-in-service and headway figures packed into the dev app page.
# It does not build an apk and it does not publish anything.
name: Timetable checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract the app page
        run: |
          python3 - << 'PY'
          import base64, gzip, pathlib, os
          raw = pathlib.Path("data/mrt-dev-page.b64").read_text()
          html = gzip.decompress(base64.b64decode(raw))
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "index.html"
          out.write_bytes(html)
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write(f"MRT_INDEX={out}\n")
          print(f"Extracted {len(html)} bytes")
          PY

      - name: Check trains in service and headways
        run: node --test tests/timetable.test.mjs

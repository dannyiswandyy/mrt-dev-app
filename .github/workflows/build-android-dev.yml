                      c.setRequestProperty("Cookie", "SOCS=CAI; CONSENT=YES+");   // skips the cookie-consent page some countries get
                      if (c.getResponseCode() != 200) throw new java.io.IOException("YouTube returned " + c.getResponseCode());
